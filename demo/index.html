<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rejestry i VAT — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--chrome:#10141D;--chrome2:#1A2030;--line:rgba(255,255,255,.1);--txt:#E6EBF3;--mut:#8E99AD;--acc:#4C7BEA}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:500 13.5px/1.4 "Onest",system-ui,sans-serif;color:var(--txt);background:var(--chrome);display:flex;flex-direction:column;overflow:hidden}
button,a,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #8AB4FF;outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px;white-space:nowrap}
.brand .lg{width:28px;height:28px;border-radius:8px;background:linear-gradient(120deg,#25407A,#4C7BEA);display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{font-weight:600}
.brand small{color:var(--mut);margin-left:2px}
.grp{display:flex;align-items:center;gap:2px;background:var(--chrome2);border:1px solid var(--line);border-radius:10px;padding:3px}
.grp button{border:0;background:none;padding:6px 11px;border-radius:7px;color:var(--mut);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.grp button:hover{color:var(--txt)}
.grp button[aria-pressed=true]{background:#fff;color:#111}
.grp svg{width:16px;height:16px}
.lbl{color:var(--mut);margin:0 2px 0 6px;white-space:nowrap}
.sp{flex:1}
.open{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--mut);padding:7px 10px;border-radius:8px;border:1px solid var(--line);white-space:nowrap}
.open:hover{color:var(--txt);background:var(--chrome2)}
.cur{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.cur b{color:var(--txt);font-weight:600}

.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#1F2840 0%,transparent 60%),var(--chrome);overflow:hidden}
.device{position:relative;transition:width .35s cubic-bezier(.2,.8,.2,1),height .35s cubic-bezier(.2,.8,.2,1),border-radius .35s,padding .35s,box-shadow .35s;transform-origin:center center}
.device iframe{display:block;width:100%;height:100%;border:0;background:#ECEFF3;transition:border-radius .35s}
.stage.desktop .device{width:100%;height:100%;padding:0;border-radius:0}
.stage.desktop .device iframe{border-radius:0}
.stage.phone .device{padding:12px;border-radius:48px;background:#05070B;box-shadow:0 0 0 2px #2A3142,0 40px 80px -30px rgba(0,0,0,.8)}
.stage.phone .device iframe{border-radius:36px}
.stage.phone .device::before{content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);width:90px;height:22px;border-radius:999px;background:#05070B;z-index:2;pointer-events:none;opacity:.0}
.hint{position:absolute;left:14px;bottom:12px;color:var(--mut);font-size:12px;pointer-events:none}
@media (max-width:900px){ .cur{display:none} }
@media (max-width:640px){ .brand small,.lbl{display:none} .bar{gap:6px;padding:8px} .grp button{padding:6px 8px} .grp button .t{display:none} }
@media (prefers-reduced-motion:reduce){ .device,.device iframe{transition:none} }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="lg">VAT</span><b>Rejestry i VAT</b><small>demo</small></div>
  <span class="lbl">Widok</span>
  <div class="grp" role="group" aria-label="Urządzenie">
    <button data-dev="desktop" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="t">Komputer</span></button>
    <button data-dev="phone" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg><span class="t">Telefon</span></button>
  </div>
  <div class="grp" role="group" aria-label="Model telefonu" id="models" hidden>
    <button data-model="375x667" aria-pressed="true">iPhone SE</button>
    <button data-model="390x844" aria-pressed="false">iPhone 14</button>
  </div>
  <span class="lbl">Motyw</span>
  <div class="grp" role="group" aria-label="Motyw">
    <button data-theme="light" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="t">Jasny</span></button>
    <button data-theme="dark" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="t">Ciemny</span></button>
  </div>
  <span class="lbl">Ekran</span>
  <div class="grp" role="group" aria-label="Ekran">
    <button data-go="glowna.html">Główna</button>
    <button data-go="rejestr.html">Rejestr VAT</button>
    <button data-go="wkrotce.html?o=kpir">Pozostałe</button>
  </div>
  <span class="sp"></span>
  <span class="cur" id="cur"></span>
  <a class="open" id="openTab" href="glowna.html" target="_blank" rel="noopener" title="Otwórz bieżący ekran w nowej karcie"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>Nowa karta</a>
</header>
<main class="stage desktop" id="stage">
  <div class="device" id="device"><iframe id="app" title="Prototyp: Rejestry i VAT" src="glowna.html?theme=light"></iframe></div>
  <span class="hint" id="hint"></span>
</main>
<script>
const $ = s => document.querySelector(s);
const st = { dev:'desktop', model:'375x667', theme:'light', page:'glowna.html' };
try { const s = JSON.parse(localStorage.getItem('vat-demo') || '{}'); Object.assign(st, s); } catch(e){}
const ALLOWED = ['glowna.html','rejestr.html','wkrotce.html'];
function safePage(p){ const [path, q = ''] = String(p || '').split('?'); return ALLOWED.includes(path) ? path + (q && /^[a-z0-9=&]+$/i.test(q) ? '?' + q : '') : 'glowna.html'; }
st.page = safePage(st.page); st.theme = st.theme === 'dark' ? 'dark' : 'light'; st.dev = st.dev === 'phone' ? 'phone' : 'desktop'; if (!['375x667','390x844'].includes(st.model)) st.model = '375x667';
const save = () => { try { localStorage.setItem('vat-demo', JSON.stringify(st)); } catch(e){} };
const PAGES = { 'glowna.html':'Główna', 'rejestr.html':'Rejestry i VAT', 'wkrotce.html':'Pozostałe obszary' };

function layout(){
  const stage = $('#stage'), dev = $('#device');
  stage.className = 'stage ' + st.dev;
  $('#models').hidden = st.dev !== 'phone';
  if (st.dev === 'phone'){
    const [w, h] = st.model.split('x').map(Number);
    const fw = w + 24, fh = h + 24;
    dev.style.width = fw + 'px'; dev.style.height = fh + 'px';
    const r = stage.getBoundingClientRect();
    const sc = Math.min(1, (r.height - 32) / fh, (r.width - 32) / fw);
    dev.style.transform = sc < 1 ? `scale(${sc})` : '';
    $('#hint').textContent = `${w}×${h}` + (sc < 1 ? ` · pomniejszono do ${Math.round(sc*100)}%` : '');
  } else {
    dev.style.width = ''; dev.style.height = ''; dev.style.transform = '';
    $('#hint').textContent = '';
  }
  document.querySelectorAll('[data-dev]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dev === st.dev)));
  document.querySelectorAll('[data-model]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.model === st.model)));
  document.querySelectorAll('[data-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === st.theme)));
  const base = st.page.split('?')[0];
  document.querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.go.split('?')[0] === base)));
  $('#cur').textContent = 'Ekran: ' + (PAGES[base] || base);
  $('#openTab').href = st.page + (st.page.includes('?') ? '&' : '?') + 'theme=' + st.theme;
  document.body.style.background = st.theme === 'dark' ? '#0A0D13' : '';
}
function go(href){
  const [p, q = ''] = href.split('?');
  const params = new URLSearchParams(q); params.set('theme', st.theme);
  $('#app').src = p + '?' + params.toString();
  st.page = safePage(href); save(); layout();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.dev){ st.dev = b.dataset.dev; save(); layout(); sendFrame(); }
  else if (b.dataset.model){ st.model = b.dataset.model; save(); layout(); }
  else if (b.dataset.theme){ st.theme = b.dataset.theme; save(); layout(); $('#app').contentWindow.postMessage({ type:'vat-theme', theme: st.theme }, '*'); }
  else if (b.dataset.go){ go(b.dataset.go); }
});
// The app reports which page is open and which theme it uses.
window.addEventListener('message', e => {
  if (e.source !== $('#app').contentWindow || !e.data || e.data.type !== 'vat-page') return;
  st.page = safePage(e.data.page); st.theme = e.data.theme === 'dark' ? 'dark' : 'light'; save(); layout();
  sendFrame();
});
function sendFrame(){ try { $('#app').contentWindow.postMessage({ type:'vat-frame', phone: st.dev === 'phone' }, '*'); } catch(e){} }
window.addEventListener('resize', layout);
$('#app').src = st.page + (st.page.includes('?') ? '&' : '?') + 'theme=' + st.theme;
layout();
</script>
</body>
</html>
