<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wkrótce — Onsaldo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.min.js"></script>
<meta name="dark-ready" content="1">
<script src="shared/core.js"></script>
<script src="shared/shell.js"></script>
<style>
:root{--bg:#ECEFF3;--panel:#fff;--ink:#1E2430;--muted:#5B6474;--faint:#949CAB;--line:#E2E6EC;--hover:#F4F6F9;--blue:#0050D8;--toast-bg:#15274D}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{overflow-x:clip}
[hidden]{display:none!important}
body{background:linear-gradient(155deg,#F4F6F9 0%,#E9EDF2 42%,#DBE1EA 100%);background-attachment:fixed;color:var(--ink);font:400 14px/1.5 "Onest",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.lucide{width:18px;height:18px;flex:none}
.wrap{max-width:1160px;margin:0 auto;padding:24px 20px 80px;display:grid;gap:18px}
h1{margin:4px 0 0;font-size:32px;letter-spacing:-.02em;line-height:1.15}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:56px 24px;display:grid;justify-items:center;text-align:center;gap:8px;box-shadow:0 1px 2px rgba(23,27,36,.04)}
.card .ic{width:64px;height:64px;border-radius:18px;background:linear-gradient(120deg,#15274D,#1F3B76);color:#fff;display:grid;place-items:center;margin-bottom:6px}
.card .ic svg{width:28px;height:28px}
.card h2{margin:0;font-size:20px}
.card p{margin:0;color:var(--muted);max-width:44ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:#15274D;border-color:#15274D;color:#fff}
.btn.pri:hover{background:#1F3B76}
@media (max-width:520px){.wrap{padding:16px 12px 60px}h1{font-size:26px}.card{padding:40px 16px}}
html[data-theme=dark]{--bg:#0E131B;--panel:#161D29;--ink:#E6EBF3;--muted:#9AA6B8;--faint:#6B778A;--line:#263042;--hover:#1D2534;--blue:#9DB8FF;--toast-bg:#C9D6F5;--toast-fg:#15274D;color-scheme:dark}
html[data-theme=dark] body{background:linear-gradient(155deg,#141A25 0%,#0F141C 45%,#0A0E14 100%);background-attachment:fixed}
html[data-theme=dark] .card .ic{background:linear-gradient(120deg,#C9D6F5,#E3EAFB);color:#15274D}
html[data-theme=dark] .btn.pri{background:#C9D6F5;border-color:#C9D6F5;color:#15274D}
html[data-theme=dark] .btn.pri:hover{background:#DCE5FA}
html[data-theme=dark] .card{box-shadow:none}
html.theme-anim,html.theme-anim *{transition:background-color .35s ease,color .35s ease,border-color .35s ease!important}
</style>
</head>
<body>
<header id="topbar"></header>
<main class="wrap page-enter">
  <div>
    <nav class="crumbs" aria-label="Ścieżka"><a href="home-1-sciezka.html" data-home><i data-lucide="arrow-left"></i>Obszary księgowe</a></nav>
    <h1 id="title">Wkrótce</h1>
  </div>
  <section class="card">
    <span class="ic"><i data-lucide="hammer" id="ic"></i></span>
    <h2 id="sub">Ten obszar jest w przygotowaniu</h2>
    <p>W tym prototypie działa tylko obszar „Rejestry i VAT”. Pozostałe ekrany pojawią się w kolejnych wersjach.</p>
    <div class="acts">
      <a class="btn" href="home-1-sciezka.html" data-home><i data-lucide="layout-grid"></i>Wróć do obszarów</a>
      <a class="btn pri" href="03-podglad.html"><i data-lucide="receipt-text"></i>Otwórz Rejestry i VAT</a>
    </div>
  </section>
</main>
<script>
const PAGES = {
  ksiegowania:['Księgowania','landmark'], kpir:['KPiR','landmark'], przychody:['Ewidencja przychodów','banknote'], ksiegi:['Pełne księgi','file-text'],
  majatek:['Majątek','archive'], kontrole:['Kontrole','list-checks'], profil:['Mój profil','user-round'], ustawienia:['Ustawienia konta','settings']
};
const key = new URLSearchParams(location.search).get('o');
const pg = PAGES[key];
if (pg){ document.getElementById('title').textContent = pg[0]; document.title = pg[0] + ' — Onsaldo'; document.getElementById('ic').setAttribute('data-lucide', pg[1]); }
Shell.mount();
VAT.bindMenus();
VAT.icons();
</script>
</body>
</html>
